[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "v2pc"
version = "0.1.0"
description = "Visual Two-Party Computation"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "Pillow>=10",
  "Flask>=3",
]

[project.scripts]
v2pc = "v2pc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
v2pc = ["templates/*.html", "static/*.css", "static/*.js"]
